# English is the fallback; error keys stay stable for API clients in every language.
COURSE_NOT_FOUND=Course was not found.
STUDENT_NOT_FOUND=Student was not found.
STUDENT_EXISTS=Student number or email already exists.
COURSE_INACTIVE=Course is archived and cannot accept enrollment.
COURSE_UNAVAILABLE=Course validation is temporarily unavailable.
ALREADY_ENROLLED=Student is already enrolled in this course.
ENROLLMENT_NOT_FOUND=Enrollment was not found for this student.
INVALID_PAGE=Page must be nonnegative and size must be between 1 and 100.
INVALID_INPUT=The request contains invalid input.
INTERNAL_ERROR=An unexpected error occurred.
RESOURCE_NOT_FOUND=Resource was not found.
METHOD_NOT_ALLOWED=HTTP method is not allowed for this resource.
UNSUPPORTED_MEDIA_TYPE=Use application/json for this request.
validation.NotBlank=Must not be blank.
validation.NotNull=Must not be null.
validation.Size=Length is outside the allowed range.
validation.Email=Must be a valid email address.
validation.Min=Value is below the allowed range.
validation.Max=Value exceeds the allowed range.
