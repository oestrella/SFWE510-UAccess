# Accept-Language selects these Spanish details without changing the application error codes.
COURSE_NOT_FOUND=No se encontro el curso.
STUDENT_NOT_FOUND=No se encontro el estudiante.
STUDENT_EXISTS=El numero de estudiante o correo ya existe.
COURSE_INACTIVE=El curso esta archivado y no acepta inscripciones.
COURSE_UNAVAILABLE=La validacion del curso no esta disponible temporalmente.
ALREADY_ENROLLED=El estudiante ya esta inscrito en este curso.
ENROLLMENT_NOT_FOUND=No se encontro la inscripcion para este estudiante.
INVALID_PAGE=La pagina debe ser no negativa y el tamano debe estar entre 1 y 100.
INVALID_INPUT=La solicitud contiene datos no validos.
INTERNAL_ERROR=Ocurrio un error inesperado.
RESOURCE_NOT_FOUND=No se encontro el recurso.
METHOD_NOT_ALLOWED=El metodo HTTP no esta permitido para este recurso.
UNSUPPORTED_MEDIA_TYPE=Use application/json para esta solicitud.
validation.NotBlank=No debe estar vacio.
validation.NotNull=No debe ser nulo.
validation.Size=La longitud esta fuera del rango permitido.
validation.Email=Debe ser un correo electronico valido.
validation.Min=El valor es inferior al rango permitido.
validation.Max=El valor supera el rango permitido.
